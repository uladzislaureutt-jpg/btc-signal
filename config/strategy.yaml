market:
  symbol: BTCUSDT
  sources:
    - binance_usdm
    - bybit_linear
    - okx_swap
    - binance_data
  request_timeout_seconds: 20

timeframes:
  regime: 1d
  setup: 4h
  trigger: 1h

history:
  live_1h_bars: 1000
  live_4h_bars: 260
  live_1d_bars: 400
  backtest_days: 240

indicators:
  ema_fast: 50
  ema_slow: 200
  ema_slope_bars: 5
  rsi_period: 14
  atr_period: 14
  volume_median_period: 20

levels:
  swing_window: 3
  lookback_bars: 240
  atr_zone: 0.30
  cluster_atr: 0.45
  min_touches: 2
  min_quality: 5
  max_signal_quality: 9
  max_distance_atr: 0.80

signal:
  watch_score: 65
  min_score: 75
  strong_score: 85
  cooldown_hours: 3
  max_signal_age_minutes: 75
  require_price_action: true
  max_rejection_volume_ratio: 1.05

risk:
  stop_atr: 0.35
  min_rr: 1.8
  target_rr: 2.2
  max_holding_hours: 48
  fee_bps_round_trip: 20
  slippage_bps_round_trip: 10
  max_cost_r: 0.60

# Frozen before the one-time 2020-2023 historical holdout. Sensitivity output is
# descriptive only and must not be used to replace this primary specification.
trend_long:
  timeframe: 4h
  breakout_bars: 20
  ema_period: 200
  ema_slope_bars: 20
  atr_period: 14
  initial_stop_atr: 2.0
  trailing_atr: 3.0
  trailing_activation_atr: 1.0
  min_risk_to_cost: 8.0
  max_holding_days: 60
  require_channel_reset: true
  round_trip_cost_bps: 30
  regime_lookback_days: 180
  regime_threshold: 0.15

# Frozen before the one-time 2020-2023 USD-M perpetual holdout. This engine
# tests rejection from resistance, not trend-following shorts.
short_reversion:
  timeframe: 4h
  resistance_lookback_bars: 20
  atr_period: 14
  rsi_period: 14
  min_rsi: 60
  rejection_close_location_max: 0.50
  initial_stop_atr: 2.0
  target_r: 2.0
  min_risk_to_cost: 8.0
  max_holding_days: 14
  cooldown_hours: 72
  round_trip_cost_bps: 30
  regime_lookback_days: 180
  regime_threshold: 0.15

# Research release 0.3.0. Frozen before the combined 2020-2026 YTD run.
# The prior short-reversion engine remains archived and is not part of 0.3.0.
trend_bidirectional:
  timeframe: 4h
  breakout_bars: 20
  ema_period: 200
  atr_period: 14
  initial_stop_atr: 2.0
  trailing_atr: 3.0
  trailing_activation_atr: 1.0
  min_risk_to_cost: 4.0
  max_holding_days: 60
  round_trip_cost_bps: 30
  reference_target_1_r: 2.0
  reference_target_2_r: 3.0
  regime_lookback_days: 180
  regime_threshold: 0.15

fast_trend:
  enabled: true
  min_close_breakout_atr: 0.50
  min_momentum_atr: 1.50
  min_directional_closes: 3
  min_ema_separation_atr: 0.25
  reversal_min_ema_separation_atr: 0.50

# One exceptional closed 4H candle (does not need 3 decreasing closes).
# A nearby old swing support or a large rebound before entry still vetoes it.
crash_impulse:
  enabled: true
  min_single_close_move_atr: 2.0
  min_candle_body_atr: 1.25
  max_close_location: 0.30
  max_previous_ema_distance_atr: 3.0
  min_ema_separation_atr: 0.25
  min_extreme_room_atr: 1.0
  max_extreme_penetration_atr: 0.75
  max_entry_deviation_atr: 0.60

# Renewed momentum after a narrow base; prevents permanent 3-ATR EMA lock.
base_breakout:
  enabled: true
  consolidation_bars: 6
  max_close_range_atr: 1.25
  min_close_breakout_atr: 0.80
  min_momentum_atr: 1.25
  min_directional_closes: 2
  min_ema_separation_atr: 0.25
  min_extreme_room_atr: 1.0
  max_extreme_penetration_atr: 0.75
  max_entry_deviation_atr: 0.60

# Informational alert after a sharp swing and a confirmed move against EMA200.
countertrend_watch:
  enabled: true
  min_prior_swing_atr: 3.0
  min_recovery_atr: 2.5
  min_momentum_atr: 1.5
  min_close_breakout_atr: 0.25

structure:
  fib_lookback_bars: 180
  fib_ratios: [0.236, 0.382, 0.5, 0.618, 0.786, 1.0]
  late_entry_after_retracement: 0.50
  late_entry_max_room_atr: 1.50
  minimum_tp1_r: 1.0
  minimum_tp2_r: 1.5
  # Only for operational EARLY entries; leave FAST and frozen 20-bar unchanged.
  early_max_ema_distance_atr: 3.0
  early_min_extreme_room_atr: 1.0
  # Production Donchian entries: prevent weak late-stage breaks and reclaimed levels.
  extended_breakout_ema_distance_atr: 6.0
  extended_breakout_min_depth_atr: 0.20
  swing_extreme_lookback_bars: 180
  # Reset of same-side signals requires a meaningful close-based pullback.
  episode_reset_lookback_hours: 720
  episode_reset_pullback_atr: 1.25
  episode_reset_counter_closes: 2
  # A strong Donchian breakout from a fresh base can also reset the episode.
  episode_base_max_penetration_atr: 1.75
  episode_hours: 24

# Operational early-short overlay. It does not alter the frozen 0.3.0
# research engine. EMA200 classifies the regime but no longer blocks a valid
# close/momentum breakdown after price crosses below it.
early_short:
  enabled: true
  min_breakout_atr: 0.25
  close_breakout_bars: 6
  min_close_breakout_atr: 0.25
  momentum_bars: 3
  min_momentum_atr: 1.0
  min_lower_closes: 2
  ema_confirm_bars: 2
  min_ema_separation_atr: 0.25
  reversal_min_ema_separation_atr: 0.50

# Symmetric early-long overlay for recoveries before the slower 20-bar high is cleared.
early_long:
  enabled: true
  min_breakout_atr: 0.25
  close_breakout_bars: 6
  min_close_breakout_atr: 0.25
  momentum_bars: 3
  min_momentum_atr: 1.0
  min_higher_closes: 2
  ema_confirm_bars: 2
  min_ema_separation_atr: 0.25
  reversal_min_ema_separation_atr: 0.50

weights:
  level_quality: 30
  regime: 20
  structure_4h: 15
  price_action_1h: 15
  volume: 0
  momentum: 5
  volatility: 5
