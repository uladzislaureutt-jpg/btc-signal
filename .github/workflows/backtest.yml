name: BTC 240-day backtest

on:
  workflow_dispatch:
    inputs:
      days:
        description: Evaluation period in days (warmup is added separately)
        required: true
        default: "240"
  push:
    branches:
      - main
    paths:
      - ".github/backtest-trigger"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.lock
      - run: pip install --no-deps .
      - name: Run historical backtest
        env:
          BACKTEST_DAYS: "${{ inputs.days || '240' }}"
        run: |
          mkdir -p reports
          btc-signal backtest --days "$BACKTEST_DAYS" --output reports/backtest_trades.csv --market-output reports/backtest_market_1h.csv | tee reports/backtest_summary.json
      - name: Publish backtest summary
        if: always()
        run: |
          if [ -f reports/backtest_summary.json ]; then
            echo '### BTC backtest summary' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat reports/backtest_summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload backtest reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-backtest-${{ inputs.days || '240' }}d-run-${{ github.run_number }}
          path: reports/
          if-no-files-found: error
          retention-days: 30
