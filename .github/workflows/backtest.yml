name: BTC historical backtest

on:
  workflow_dispatch:
    inputs:
      days:
        description: Evaluation period in days (warmup is added separately)
        required: true
        default: "240"
  push:
    branches:
      - main
    paths:
      - ".github/backtest-trigger"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.lock
      - run: pip install --no-deps .
      - name: Run historical backtest
        env:
          BACKTEST_DAYS: "${{ inputs.days || '1000' }}"
        run: |
          mkdir -p reports
          btc-signal backtest \
            --days "$BACKTEST_DAYS" \
            --output reports/backtest_trades.csv \
            --market-output reports/backtest_market_1h.csv \
            --diagnostics-output reports/backtest_diagnostics.json \
            --manifest-output reports/backtest_manifest.json \
            | tee reports/backtest_summary.json
      - name: Run parameter sensitivity
        run: |
          btc-signal sensitivity \
            --market-input reports/backtest_market_1h.csv \
            --baseline-summary reports/backtest_summary.json \
            --output reports/backtest_sensitivity.json \
            > /dev/null
      - name: Publish backtest summary
        if: always()
        run: |
          if [ -f reports/backtest_summary.json ]; then
            echo '### BTC backtest summary' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat reports/backtest_summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish sensitivity summary
        if: always()
        run: |
          if [ -f reports/backtest_sensitivity.json ]; then
            echo '### Parameter sensitivity' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            jq '{method, scenario_count, positive_expectancy_scenarios, baseline_verification, scenarios: [.scenarios[] | {label, trades, total_r, expectancy_r, profit_factor, max_drawdown_r}]}' reports/backtest_sensitivity.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload backtest reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-backtest-${{ inputs.days || '1000' }}d-run-${{ github.run_number }}
          path: reports/
          if-no-files-found: error
          retention-days: 30
