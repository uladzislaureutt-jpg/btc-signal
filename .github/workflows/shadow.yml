name: BTC trend signal

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Run immediately even outside a 4H boundary"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "7 */4 * * *"
  push:
    branches: [main]
    paths:
      - "src/btc_signal/**"
      - "config/strategy.yaml"
      - "requirements.lock"
      - ".github/workflows/shadow.yml"

permissions:
  contents: read

concurrency:
  group: btc-trend-signal
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run_signal: ${{ steps.schedule_gate.outputs.run_signal }}
    steps:
      - id: schedule_gate
        name: Allow only 4H dispatch slots
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.force }}" != "true" ]]; then
            hour="$(date -u +%H)"
            if (( 10#$hour % 4 != 0 )); then
              echo "Skipping hourly external dispatch at ${hour}:00 UTC"
              echo "run_signal=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "run_signal=true" >> "$GITHUB_OUTPUT"

  signal:
    needs: gate
    if: needs.gate.outputs.run_signal == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.lock
      - run: pip install --no-deps .
      - name: Dry-run signal after code changes
        if: github.event_name == 'push'
        run: btc-signal live --dry-run
      - name: Produce scheduled or manual signal
        if: github.event_name != 'push'
        run: btc-signal live
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
