name: Frozen BTC trend holdout 2020-2023

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/trend-backtest-trigger"

permissions:
  contents: read

jobs:
  trend-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.lock
      - run: pip install --no-deps .
      - name: Run frozen holdout and 81-scenario robustness surface
        run: |
          btc-signal trend-backtest \
            --evaluation-start 2020-01-01 \
            --evaluation-end 2024-01-01 \
            --archive-start 2019-06 \
            --archive-end 2024-03 \
            --reports-dir reports/trend_2020_2023 \
            | tee reports/trend_2020_2023/console_summary.json
      - name: Publish holdout summary
        if: always()
        run: |
          if [ -f reports/trend_2020_2023/trend_summary.json ]; then
            echo '### Frozen BTC trend holdout (2020-2023)' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            jq '{trades, total_r, gross_total_r, total_cost_r, expectancy_r, profit_factor, max_drawdown_r, median_risk_pct, median_holding_hours, exposure_pct, by_year, by_regime, bootstrap, strategy_equity_1pct_risk, buy_and_hold, diagnostics}' reports/trend_2020_2023/trend_summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish robustness summary
        if: always()
        run: |
          if [ -f reports/trend_2020_2023/trend_sensitivity.json ]; then
            echo '### Frozen robustness surface' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            jq '{method, scenario_count, positive_scenarios, positive_share, primary_parameters, primary_replay, by_cost_bps}' reports/trend_2020_2023/trend_sensitivity.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload independently reviewable reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-trend-2020-2023-run-${{ github.run_number }}
          path: reports/trend_2020_2023/
          if-no-files-found: error
          retention-days: 30
